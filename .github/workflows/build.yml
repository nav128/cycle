name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.0'
          validate-wrappers: false

      - name: Configure Android SDK path
        working-directory: cycle-tracker/cycle-tracker
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build debug APK
        working-directory: cycle-tracker/cycle-tracker
        run: gradle assembleDebug --stacktrace

      - name: Install and launch on Android 16 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          script: |
            adb install -r cycle-tracker/cycle-tracker/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.cycletracker.app/.MainActivity

      - uses: actions/upload-artifact@v4
        with:
          name: cycle-tracker-debug-apk
          path: cycle-tracker/cycle-tracker/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
